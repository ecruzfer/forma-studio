<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Agradecimiento - FORMA STUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f6f3;
        }
        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .fade-in-up.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">

    <!-- Tarjeta Principal (Tamaño ideal para incluir en pedidos físicos) -->
    <main class="w-full max-w-sm bg-white rounded-2xl shadow-xl border border-stone-100 p-6 sm:p-8 flex flex-col items-center text-center relative overflow-hidden">
        
        <!-- Detalle decorativo sutil superior -->
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-stone-200 via-stone-400 to-stone-200"></div>

        <!-- PASO 1: Logo de FORMA STUDIO -->
        <div id="step-logo" class="fade-in-up w-full flex flex-col items-center mb-6 pt-2">
            <div class="w-32 sm:w-36 mb-2 flex items-center justify-center">
                <svg viewBox="0 0 500 200" class="w-full h-auto text-stone-900" fill="currentColor">
                    <!-- SVG vectorizado limpio y elegante del logo FORMA STUDIO -->
                    <g transform="translate(150, 10)">
                        <polygon points="50,0 95,25 95,75 50,100 5,75 5,25" fill="none" stroke="currentColor" stroke-width="4"/>
                        <polyline points="50,0 50,50 95,25" fill="none" stroke="currentColor" stroke-width="4"/>
                        <polyline points="5,25 50,50 50,100" fill="none" stroke="currentColor" stroke-width="4"/>
                        <line x1="15" y1="35" x2="35" y2="45" stroke="currentColor" stroke-width="3"/>
                        <line x1="15" y1="43" x2="35" y2="53" stroke="currentColor" stroke-width="3"/>
                        <line x1="15" y1="51" x2="35" y2="61" stroke="currentColor" stroke-width="3"/>
                        <line x1="15" y1="59" x2="35" y2="69" stroke="currentColor" stroke-width="3"/>
                        <line x1="15" y1="67" x2="35" y2="77" stroke="currentColor" stroke-width="3"/>
                    </g>
                    <text x="250" y="145" font-family="'Montserrat', sans-serif" font-size="36" font-weight="400" letter-spacing="8" text-anchor="middle" fill="#292524">FORMA</text>
                    <text x="250" y="180" font-family="'Montserrat', sans-serif" font-size="16" font-weight="500" letter-spacing="10" text-anchor="middle" fill="#78716c">STUDIO</text>
                </svg>
            </div>
            <div class="w-12 h-[1px] bg-stone-300 mt-2"></div>
        </div>

        <!-- PASO 2: Mensaje de agradecimiento -->
        <div id="step-message" class="fade-in-up w-full flex flex-col items-center mb-8">
            <h1 class="text-lg sm:text-xl font-medium text-stone-900 mb-3 flex items-center justify-center gap-2">
                ¡Gracias por tu compra! <span class="text-amber-400 text-base">💛</span>
            </h1>
            <p class="text-stone-600 text-xs sm:text-sm leading-relaxed px-2 font-light">
                Cada pedido significa mucho para nosotros. Esperamos que disfrutes tu producto tanto como disfrutamos prepararlo para ti.
            </p>
        </div>

        <!-- PASO 3: Código QR y Enlace -->
        <div id="step-qr" class="fade-in-up w-full flex flex-col items-center pb-2">
            <!-- QR estilizado con la imagen real proporcionada -->
            <div class="bg-stone-50 p-3 rounded-xl border border-stone-200 shadow-inner mb-4 inline-block relative">
                <div class="w-28 h-28 sm:w-32 sm:h-32 bg-white p-1 rounded-lg flex items-center justify-center relative overflow-hidden">
                    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAABGdBTUEAALGPC/xhBQAAAwBQTFRF..." alt="Código QR FORMA STUDIO" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/200x200/ffffff/000000?text=QR+Code'">
                </div>
            </div>

            <!-- Botón elegante "Saber más" -->
            <div class="w-full pt-1">
                <a href="https://linktr.ee/forma.studio3D" target="_blank" rel="noopener noreferrer" class="group relative inline-flex items-center justify-center w-full px-6 py-3.5 text-xs font-medium tracking-[0.2em] uppercase text-white bg-stone-900 rounded-xl overflow-hidden shadow-md hover:bg-black transition-all duration-300 transform hover:-translate-y-0.5">
                    <span class="relative z-10 flex items-center gap-2">
                        Saber más
                        <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                        </svg>
                    </span>
                </a>
            </div>
        </div>

    </main>

    <!-- Script seguro de control de animación escalonada -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const logo = document.getElementById('step-logo');
                if (logo) logo.classList.add('active');
            }, 300);

            setTimeout(() => {
                const message = document.getElementById('step-message');
                if (message) message.classList.add('active');
            }, 1100);

            setTimeout(() => {
                const qr = document.getElementById('step-qr');
                if (qr) qr.classList.add('active');
            }, 1900);
        });
    </script>
</body>
</html>
