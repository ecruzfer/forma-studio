  <style>
    :root { color-scheme: light; --oxford: #3e3d39; --paper: #f8f7f4; --accent: #b89b6a; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--oxford); font-family: Georgia, 'Times New Roman', serif; }
    main { min-height: 100svh; padding: clamp(34px, 8vw, 82px) 22px 56px; display: flex; flex-direction: column; align-items: center; }
    .brand { display: block; width: min(88vw, 900px); height: auto; margin: 0 auto clamp(52px, 10vw, 105px); }
    .thank-you { width: min(100%, 600px); text-align: center; display: flex; flex-direction: column; align-items: center; }
    .rule { width: 42px; height: 1px; background: #b3a997; margin-bottom: 27px; }
    h1 { margin: 0 0 18px; font-size: clamp(26px, 5vw, 38px); line-height: 1.2; font-weight: 400; }
    h1 span { color: var(--accent); font-family: Arial, sans-serif; font-size: .9em; }
    p { max-width: 510px; margin: 0; font-size: clamp(16px, 2.8vw, 19px); line-height: 1.75; }
    .qr { display: block; width: clamp(175px, 42vw, 245px); height: auto; margin: 34px auto 28px; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-width: 160px; min-height: 48px; padding: 12px 28px; border: 1px solid var(--oxford); border-radius: 2px; background: var(--oxford); color: #fff; font: 600 14px/1 Arial, sans-serif; letter-spacing: .09em; text-decoration: none; transition: background-color .2s ease, color .2s ease; }
    .button:hover, .button:focus-visible { background: transparent; color: var(--oxford); outline: none; }
    .button:focus-visible { box-shadow: 0 0 0 3px #b89b6a; }
    @media (max-width: 480px) { main { padding-top: 44px; } .brand { width: 92vw; margin-bottom: 55px; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .button { transition: none; } }
  </style>
